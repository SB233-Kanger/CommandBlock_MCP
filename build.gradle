plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"commandblock_mcp" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

afterEvaluate {
	['Server': 'verification-server', 'Client': 'verification-client'].each { kind, directory ->
		tasks.named("runVerification${kind}") {
			def report = layout.buildDirectory.file("${directory}/verification-result.txt")
			doFirst {
				report.get().asFile.parentFile.mkdirs()
				report.get().asFile.text = 'RUNNING'
			}
			doLast {
				if (!report.get().asFile.text.startsWith('PASS ')) {
					throw new GradleException("World verification failed: ${report.get().asFile.text}")
				}
			}
		}
	}
}

dependencies {
	implementation 'io.modelcontextprotocol.sdk:mcp:2.0.1'
	implementation 'org.eclipse.jetty.ee11:jetty-ee11-servlet:12.1.13'
	implementation 'org.eclipse.jetty:jetty-server:12.1.13'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Ship the complete HTTP/SDK runtime as nested Fabric libraries, using Minecraft's SLF4J.
configurations { bundled }
dependencies {
	bundled 'io.modelcontextprotocol.sdk:mcp:2.0.1'
	bundled 'org.eclipse.jetty.ee11:jetty-ee11-servlet:12.1.13'
}
configurations.bundled.exclude group: 'org.slf4j'
configurations.bundled.resolvedConfiguration.resolvedArtifacts.each { artifact ->
	dependencies.add('include', "${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}") { transitive = false }
}
test { useJUnitPlatform() }

sourceSets {
	verification {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}
tasks.register('verificationJar', Jar) {
	archiveClassifier = 'verification'
	from sourceSets.verification.output
}
loom {
	mods {
		cbmcp_verification { sourceSet sourceSets.verification }
	}
	runs {
		verificationServer {
			server()
			vmArg '-Dcbmcp.verification=true'
			source sourceSets.verification
			runDir 'build/verification-server'
			programArg 'nogui'
		}
		verificationClient {
			client()
			vmArg '-Dcbmcp.verification=true'
			source sourceSets.verification
			runDir 'build/verification-client'
			programArgs '--quickPlaySingleplayer', 'cbmcp-test'
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
